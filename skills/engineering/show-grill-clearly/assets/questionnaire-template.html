    :root {
      --strip: #0d100f;
      --strip-rule: #3a403e;
      --strip-ink: #ffffff;
      --strip-soft: #b4bbb8;
      --ground: #e9ece8;
      --work: #ffffff;
      --ink: #0d100f;
      --mid: #464c49;
      --soft: #5f6663;
      --rule: #d2d7d3;
      --em: #0b7a55;
      --em-deep: #064a33;
      --em-wash: #e1f2ea;
      --em-on: #ffffff;
      --amber: #f0a30a;
      --amber-ink: #0d100f;
      --amber-text: #8a5a00;
      --warn: #a3321f;
      --sans: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
      --num: "Grill Num", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Noto Sans Mono", monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --strip: #050706;
        --strip-rule: #303634;
        --strip-soft: #a3aba7;
        --ground: #111413;
        --work: #191d1c;
        --ink: #e9ece9;
        --mid: #b3bab6;
        --soft: #959d99;
        --rule: #2e3532;
        --em: #3cbf8a;
        --em-deep: #1d7a55;
        --em-wash: #13281f;
        --em-on: #04140d;
        --amber: #f2b33d;
        --amber-ink: #111413;
        --amber-text: #f2b33d;
        --warn: #f08a74;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 1fr auto;
      background: var(--ground);
      color: var(--ink);
      font: 16px/1.75 var(--sans);
      -webkit-font-smoothing: antialiased;
      caret-color: var(--em);
      scrollbar-color: var(--rule) transparent;
    }
    ::selection { background: var(--em); color: var(--em-on); }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--em); outline-offset: 2px; }

    /* Status strip: one cell per question. */
    .strip {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 40px;
      background: var(--strip);
      color: var(--strip-ink);
    }
    .strip-title {
      flex: 0 1 260px;
      min-width: 0;
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cells {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--strip-rule) transparent;
      padding: 2px;
    }
    .cell {
      flex: 1 0 56px;
      max-width: 132px;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1.5px solid var(--strip-rule);
      background: transparent;
      color: var(--strip-soft);
      cursor: pointer;
      transition: background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
    }
    .cell:hover { border-color: var(--strip-soft); color: var(--strip-ink); }
    .cell-no { font: 700 14px/1 var(--num); font-variant-numeric: tabular-nums; }
    .cell-mark { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .cell-hub { flex: 0 0 auto; max-width: none; }
    .cell.is-done { background: var(--em); border-color: var(--em); color: var(--em-on); }
    .cell.is-must { border-color: var(--amber); color: var(--amber); }
    .cell.is-note { border-style: dashed; border-color: var(--strip-soft); color: var(--strip-ink); }
    .cell[aria-current="step"] { border-color: var(--strip-ink); color: var(--strip-ink); box-shadow: inset 0 -4px 0 var(--strip-ink); }
    .cell.is-done[aria-current="step"] { color: var(--em-on); box-shadow: inset 0 -4px 0 var(--em-on); }
    .cell:focus-visible { outline-color: var(--strip-ink); }
    .strip-count { flex: 0 0 auto; margin: 0; font: 700 15px/1 var(--num); font-variant-numeric: tabular-nums; color: var(--strip-soft); }
    .strip-count b { color: var(--strip-ink); font-weight: 700; }

    /* Views */
    .stage { min-width: 0; padding: 44px 40px 56px; }
    .view { max-width: 1360px; margin: 0 auto; }
    .view.enter { animation: enter .26s var(--ease) both; }
    .view.enter-back { animation: enter-back .26s var(--ease) both; }
    @keyframes enter { from { opacity: .6; transform: translateX(18px); } }
    @keyframes enter-back { from { opacity: .6; transform: translateX(-18px); } }

    .q {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) 340px;
      column-gap: 48px;
      align-items: start;
    }
    .q-num {
      font: 700 160px/.8 var(--num);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
      color: var(--em);
      user-select: none;
    }
    .q-main { min-width: 0; max-width: 780px; }
    .q-title { margin: 0 0 10px; font-size: 40px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
    .q-title:focus { outline: none; }
    .q-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0; font-size: 14px; color: var(--mid); }
    .tag { padding: 1px 8px; font-size: 13px; font-weight: 700; line-height: 1.6; }
    .tag-req { background: var(--amber); color: var(--amber-ink); }
    .tag-opt { border: 1.5px solid var(--rule); color: var(--mid); }
    .q-id { font: 13px var(--mono); letter-spacing: .04em; color: var(--soft); }
    .q-source { margin: 22px 0 0; font-size: 19px; line-height: 1.75; max-width: 52ch; white-space: pre-wrap; overflow-wrap: anywhere; }

    .opts { margin: 30px 0 0; padding: 0; border: 0; display: grid; gap: 10px; }
    .opt {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      background: var(--work);
      border: 1.5px solid var(--rule);
      cursor: pointer;
      transition: border-color .15s var(--ease), background-color .15s var(--ease);
    }
    .opt:hover { border-color: var(--ink); }
    .opt:has(input:focus-visible) { outline: 2px solid var(--em); outline-offset: 2px; }
    .opt:has(input:checked) { border-color: var(--em); background: var(--em-wash); }
    .cap {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font: 700 19px/1 var(--num);
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      background: var(--work);
      border: 2px solid var(--ink);
      box-shadow: 0 3px 0 var(--ink);
      transition: transform .09s var(--ease), box-shadow .09s var(--ease), background-color .15s var(--ease), color .15s var(--ease);
    }
    .opt:has(input:checked) .cap { background: var(--em); border-color: var(--em); color: var(--em-on); box-shadow: 0 3px 0 var(--em-deep); }
    .opt.pressed .cap, .opt:active .cap { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
    .opt.pressed:has(input:checked) .cap, .opt:has(input:checked):active .cap { transform: translateY(3px); box-shadow: 0 0 0 var(--em-deep); }
    .opt-body { min-width: 0; }
    .opt-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; line-height: 1.45; }
    .opt-note { display: block; margin-top: 2px; font-size: 15px; color: var(--mid); }
    .opt-key { align-self: start; padding-top: 4px; font: 13px var(--mono); color: var(--soft); max-width: 12ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rec { padding: 0 7px; border: 1.5px solid var(--ink); font-size: 12px; font-weight: 700; line-height: 1.6; }
    .clear { margin-top: 12px; padding: 4px 0; border: 0; background: none; color: var(--mid); font-size: 14px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
    .clear:hover { color: var(--ink); }

    .q-side { padding-left: 36px; border-left: 1.5px solid var(--rule); font-size: 15px; color: var(--mid); }
    .side-label { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 700; color: var(--ink); }
    .q-side ul { margin: 0 0 26px; padding-left: 20px; }
    .q-side li { margin: 4px 0; }
    .q-side p { margin: 0 0 26px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 11px 12px;
      border: 1.5px solid var(--rule);
      border-radius: 0;
      background: var(--work);
      color: var(--ink);
      font: 15px/1.65 var(--sans);
    }
    textarea::placeholder { color: var(--soft); }
    textarea:focus { outline: none; border-color: var(--em); box-shadow: 0 0 0 2px var(--em); }

    /* Overview */
    .hub { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 72px; align-items: start; }
    .hub h1 { margin: 0 0 12px; font-size: 44px; line-height: 1.25; text-wrap: balance; }
    .lede { margin: 0 0 28px; font-size: 19px; color: var(--mid); max-width: 40ch; }
    .rules { margin: 0; padding: 0; list-style: none; border-top: 1.5px solid var(--rule); }
    .rules li { padding: 12px 0; border-bottom: 1.5px solid var(--rule); font-size: 16px; }
    .rules strong { font-weight: 700; }
    .notice { margin: 20px 0 0; padding: 12px 14px; border: 1.5px solid var(--warn); color: var(--warn); font-size: 15px; }
    .hub h2 { display: flex; align-items: baseline; gap: 12px; margin: 40px 0 12px; font-size: 20px; }
    .hub-side h2:first-child { margin-top: 0; }
    .meta { font-size: 14px; font-weight: 400; color: var(--soft); }
    .recap { margin: 0; padding-left: 20px; color: var(--mid); }
    .recap li { margin: 4px 0; }
    .index { margin: 0; padding: 0; list-style: none; border-top: 1.5px solid var(--ink); }
    .index button {
      width: 100%;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 12px;
      padding: 11px 4px;
      border: 0;
      border-bottom: 1.5px solid var(--rule);
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .index button:hover { background: var(--work); }
    .index-no { font: 700 15px var(--num); font-variant-numeric: tabular-nums; color: var(--ink); }
    .index-title { min-width: 0; font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .index-state { font-size: 14px; color: var(--soft); max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .index-state.is-done { color: var(--em); font-weight: 700; }
    .index-state.is-must { color: var(--amber-text); font-weight: 700; }
    #summary { min-height: 220px; font: 13.5px/1.7 var(--mono); color: var(--mid); background: var(--work); }
    .hub-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

    /* Dock */
    .dock {
      position: sticky;
      bottom: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 40px;
      background: var(--work);
      border-top: 1.5px solid var(--rule);
    }
    .hints { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px; color: var(--mid); }
    kbd { display: inline-block; min-width: 22px; padding: 0 6px; border: 1.5px solid var(--mid); font: 700 12px/1.6 var(--num); text-align: center; color: var(--ink); }
    .status { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 14px; color: var(--em); text-align: right; }
    .status.missing { color: var(--amber-text); font-weight: 700; }
    .actions { flex: 0 0 auto; display: flex; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      transition: background-color .15s var(--ease), color .15s var(--ease);
    }
    .btn:hover { background: var(--ground); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn:disabled:hover { background: transparent; }
    .btn-primary { background: var(--ink); color: var(--work); }
    .btn-primary:hover { background: var(--em); border-color: var(--em); color: var(--em-on); }
    .btn svg { width: 16px; height: 16px; }
    #copy { gap: 0; }

    /* Payload error */
    .fatal { max-width: 760px; margin: 0 auto; }
    .fatal h1 { margin: 0 0 12px; font-size: 36px; line-height: 1.3; }
    .fatal .lede { max-width: none; }
    .fatal-list { margin: 0 0 24px; padding-left: 22px; color: var(--warn); }
    .fatal-list li { margin: 8px 0; }

    @media (max-width: 1179px) {
      .q { grid-template-columns: minmax(0, 1fr) 280px; grid-template-areas: "num side" "main side"; column-gap: 36px; }
      .q-num { grid-area: num; font-size: 72px; margin-bottom: 12px; }
      .q-main { grid-area: main; }
      .q-side { grid-area: side; padding-left: 28px; }
      #hint-pick, #hint-clear { display: none; }
      .hub { column-gap: 48px; }
    }
    @media (max-width: 860px) {
      .strip { padding: 10px 16px; gap: 12px; }
      .strip-title { display: none; }
      .stage { padding: 28px 18px 40px; }
      .q { display: block; }
      .q-num { font-size: 64px; margin-bottom: 14px; }
      .q-side { margin-top: 36px; padding: 24px 0 0; border-left: 0; border-top: 1.5px solid var(--rule); }
      .cells { gap: 4px; }
      .cell { flex: 1 0 34px; padding: 0 6px; justify-content: center; }
      .cell .cell-mark { display: none; }
      .cell-hub .cell-mark { display: inline; margin: 0; }
      .q-title { font-size: 28px; }
      .q-source { font-size: 17px; }
      .opt { grid-template-columns: 40px minmax(0, 1fr); gap: 14px; padding: 12px 14px; }
      .cap { width: 40px; height: 40px; }
      .opt-key { display: none; }
      .opt-title { font-size: 18px; }
      .hub { display: block; }
      .hub h1 { font-size: 30px; }
      .hub-side { margin-top: 40px; }
      .dock { padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
      .hints { display: none; }
      .status { flex-basis: 100%; order: -1; text-align: left; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; justify-content: center; padding: 10px 8px; }
      .copy-long { display: none; }
    }
    @media (hover: none) { .hints { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .view.enter, .view.enter-back { animation: none; }
      .cell, .opt, .cap, .btn { transition: none; }
    }
  </style>
</head>
<body>
  <header class="strip">
    <p class="strip-title" id="strip-title"></p>
    <nav class="cells" id="cells" aria-label="題目"></nav>
    <p class="strip-count" id="counter" aria-live="polite"></p>
  </header>

  <main class="stage" id="stage">
    <section class="view hub" id="hub" aria-labelledby="title">
      <div class="hub-main">
        <h1 id="title" tabindex="-1"></h1>
        <p class="lede" id="lede"></p>
        <ul class="rules">
          <li>按數字鍵選答案，<kbd>Enter</kbd> 下一題，<kbd>N</kbd> 跳到下一個還沒選的題，<kbd>C</kbd> 隨時複製回復 prompt。</li>
          <li>標示<strong>建議</strong>的選項不會自動採用；<strong>留白的題目會列為待確認</strong>。</li>
          <li>也可以只寫補充說明，由 agent 依你的說明判斷。</li>
        </ul>
        <p class="notice" id="no-persist" hidden>無法保存草稿：重新整理或關閉頁面會失去尚未複製的答案。請一次答完，或隨時按<strong>複製回復 prompt</strong> 備份。</p>
        <div id="recap-section" hidden>
          <h2>目前已確認</h2>
          <ul class="recap" id="recap-list"></ul>
        </div>
      </div>
      <div class="hub-side">
        <h2>需要你的決定 <span class="meta" id="question-meta"></span></h2>
        <ol class="index" id="index"></ol>
        <h2><label for="summary">回復 prompt</label> <span class="meta">隨答案即時更新</span></h2>
        <textarea id="summary" readonly></textarea>
        <div class="hub-actions">
          <button type="button" class="btn" id="reset">清空答案</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="dock" id="dock">
    <p class="hints"><span id="hint-pick"><kbd>1</kbd>–<kbd id="hint-max">4</kbd> 選擇</span><span id="hint-clear"><kbd>0</kbd> 取消</span><span><kbd>Enter</kbd> 下一題</span><span><kbd>N</kbd> 下一個留白</span><span><kbd>C</kbd> 複製</span></p>
    <p class="status" id="status" role="status"></p>
    <div class="actions">
      <button type="button" class="btn" id="prev">上一題</button>
      <button type="button" class="btn btn-primary" id="next">開始作答</button>
      <button type="button" class="btn" id="copy" aria-label="複製回復 prompt">複製<span class="copy-long">回復 prompt</span></button>
    </div>
  </footer>

  <script id="questionnaire-data" type="application/json">
{}
  </script>

  <script>
    (function () {
      // This renderer owns the complete payload contract and fails closed when
      // the embedded decision data is incomplete or invalid.
      var DATA = null;
      var problems = [];
      try {
        DATA = JSON.parse(document.getElementById('questionnaire-data').textContent);
      } catch (parseError) {
        problems.push('payload 不是合法的 JSON：' + parseError.message);
      }
      if (DATA) problems = validate(DATA);
      if (problems.length) { renderFatal(problems); return; }

      var QUESTIONS = DATA.questions;
      var storageKey = 'show-grill-clearly:' + location.pathname;
      var storageReady = false;
      var at = -1;
      var copiedText = null;

      function isArray(value) {
        return Object.prototype.toString.call(value) === '[object Array]';
      }

      // Collect every problem rather than stopping at the first — one round trip
      // beats making the agent regenerate the questionnaire once per mistake.
      function validate(data) {
        var found = [];
        function isObject(value) { return value !== null && typeof value === 'object' && !isArray(value); }
        function own(value, key) { return Object.prototype.hasOwnProperty.call(value, key); }
        function fields(value, allowed, path) {
          Object.keys(value).forEach(function (key) {
            if (allowed.indexOf(key) < 0) found.push(path + ' 有未知欄位 ' + key + '。');
          });
        }
        function text(value, key, path, limit) {
          if (!own(value, key) || typeof value[key] !== 'string' || !value[key].trim()) {
            found.push(path + '.' + key + ' 必須是非空白字串。'); return false;
          }
          if (limit && value[key].length > limit) {
            found.push(path + '.' + key + ' 超過 ' + limit + ' 字（目前 ' + value[key].length + ' 字）。');
          }
          return true;
        }
        if (!isObject(data)) return ['payload 根節點必須是物件。'];
        fields(data, ['title', 'lede', 'recap', 'questions'], 'payload');
        text(data, 'title', 'payload', 0);
        if (text(data, 'lede', 'payload', 40)) {
          var marks = data.lede.match(/[。！？!?]/g) || [];
          if (marks.length > 1 || (marks.length === 1 && !/[。！？!?]\s*$/.test(data.lede))) {
            found.push('payload.lede 必須只有一句。');
          }
        }
        if (!isArray(data.recap)) {
          found.push('payload.recap 必須是字串陣列。');
        } else {
          if (data.recap.length > 6) found.push('payload.recap 最多 6 則（目前 ' + data.recap.length + ' 則）。');
          data.recap.forEach(function (item, i) {
            if (typeof item !== 'string' || !item.trim()) found.push('payload.recap[' + i + '] 必須是非空白字串。');
            else if (item.length > 30) found.push('payload.recap[' + i + '] 超過 30 字（目前 ' + item.length + ' 字）。');
          });
        }
        var questions = data.questions;
        if (!isArray(questions) || !questions.length) {
          found.push('payload.questions 必須是至少含一題的陣列。'); return found;
        }

        var seen = Object.create(null);
        var total = (typeof data.title === 'string' ? data.title.length : 0)
          + (typeof data.lede === 'string' ? data.lede.length : 0);
        if (isArray(data.recap)) data.recap.forEach(function (x) { if (typeof x === 'string') total += x.length; });
        questions.forEach(function (question, index) {
          var at = 'questions[' + index + ']';
          if (!isObject(question)) { found.push(at + ' 必須是物件。'); return; }
          fields(question, ['id', 'title', 'sourceQuestion', 'required', 'context', 'scenario', 'recommendation', 'options'], at);
          if (text(question, 'id', at, 64)) {
            total += question.id.length;
            if (!/^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(question.id)) found.push(at + '.id 格式不合法。');
            var foldedId = question.id.toLowerCase();
            if (seen[foldedId]) found.push(at + '.id 與另一題重複（不分大小寫）。');
            seen[foldedId] = true;
          }
          if (text(question, 'title', at, 30)) total += question.title.length;
          if (text(question, 'sourceQuestion', at, 180)) total += question.sourceQuestion.length;
          if (!own(question, 'required') || typeof question.required !== 'boolean') found.push(at + '.required 必須是 boolean。');
          if (text(question, 'scenario', at, 80)) total += question.scenario.length;
          if (!isArray(question.context) || question.context.length < 1 || question.context.length > 3) {
            found.push(at + '.context 必須是含 1–3 則事實的字串陣列。');
          }
          if (isArray(question.context)) question.context.forEach(function (fact, contextIndex) {
            if (typeof fact !== 'string' || !fact.trim()) found.push(at + '.context[' + contextIndex + '] 必須是非空白字串。');
            else { total += fact.length; if (fact.length > 40) found.push(at + '.context[' + contextIndex + '] 超過 40 字（目前 ' + fact.length + ' 字）。'); }
          });
          var options = isArray(question.options) ? question.options : [];
          if (options.length < 2 || options.length > 4) found.push(at + '.options 必須有 2–4 個選項（目前 ' + options.length + ' 個）。');
          var keys = Object.create(null);
          options.forEach(function (option, optionIndex) {
            var optionAt = at + '.options[' + optionIndex + ']';
            if (!isObject(option)) { found.push(optionAt + ' 必須是物件。'); return; }
            fields(option, ['key', 'title', 'note'], optionAt);
            if (text(option, 'key', optionAt, 64)) {
              total += option.key.length;
              if (!/^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(option.key)) found.push(optionAt + '.key 格式不合法。');
              var foldedKey = option.key.toLowerCase();
              if (keys[foldedKey]) found.push(optionAt + '.key 在本題重複（不分大小寫）。');
              keys[foldedKey] = true;
            }
            if (text(option, 'title', optionAt, 20)) total += option.title.length;
            if (text(option, 'note', optionAt, 40)) total += option.note.length;
          });
          if (own(question, 'recommendation')) {
            if (typeof question.recommendation !== 'string' || !question.recommendation.trim()) {
              found.push(at + '.recommendation 若提供，必須是非空白字串。');
            } else if (!keys[question.recommendation.toLowerCase()]) {
              found.push(at + '.recommendation 必須對應本題的一個 option key。');
            }
          }
        });
        // Scale with question count rather than checking one exact length: splitting an
        // overlong question is the prescribed remedy, so it must not escape the budget.
        var budget = questions.length * 480;
        if (questions.length >= 5 && total > budget) {
          found.push('問卷的動態文字超過 ' + budget + ' 字（' + questions.length
            + ' 題 × 480；目前 ' + total + ' 字）；請縮短，或把後面的決定移到下一輪問卷。');
        }
        return found;
      }

      function renderFatal(list) {
        document.title = '問卷資料有誤 · Grill';
        document.querySelector('.strip').hidden = true;
        document.getElementById('dock').hidden = true;

        var stage = document.getElementById('stage');
        stage.textContent = '';

        var box = el('section', 'fatal');
        box.appendChild(el('h1', null, '這份問卷沒有產生出來'));
        box.appendChild(el('p', 'lede', 'payload 有下列問題，所以問卷完全沒有渲染——'
          + '一份只能答一半的問卷比明確的錯誤更難處理。把下面整段貼回對話，修正 payload 後重新產生問卷即可。'));

        var ul = el('ul', 'fatal-list');
        list.forEach(function (item) { ul.appendChild(el('li', null, item)); });
        box.appendChild(ul);

        var label = el('label', 'side-label', '可複製的錯誤說明');
        label.setAttribute('for', 'fatal-copy');
        box.appendChild(label);
        var output = document.createElement('textarea');
        output.id = 'fatal-copy';
        output.readOnly = true;
        output.style.minHeight = '180px';
        output.value = '問卷 payload 有下列問題，請修正後重新產生問卷：\n'
          + list.map(function (item) { return '- ' + item; }).join('\n');
        box.appendChild(output);

        stage.appendChild(box);
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function pad(n) { return n < 10 ? '0' + n : String(n); }

      function recommendedOption(question) {
        var options = question.options || [];
        for (var i = 0; i < options.length; i++) {
          if (question.recommendation && options[i].key === question.recommendation) return options[i];
        }
        return null;
      }

      function optionLabel(option) {
        return option.key + '｜' + option.title;
      }

      function optionByLabel(question, label) {
        for (var i = 0; i < question.options.length; i++) {
          if (optionLabel(question.options[i]) === label) return question.options[i];
        }
        return null;
      }

      var ARROW = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>';

      function renderHead() {
        var title = DATA.title || 'Grill 決策問卷';
        document.getElementById('title').textContent = title;
        document.getElementById('strip-title').textContent = title;
        document.title = title;
        var lede = document.getElementById('lede');
        if (DATA.lede) lede.textContent = DATA.lede; else lede.hidden = true;

        var recap = DATA.recap || [];
        if (recap.length) {
          var list = document.getElementById('recap-list');
          recap.forEach(function (item) { list.appendChild(el('li', null, item)); });
          document.getElementById('recap-section').hidden = false;
        }

        var required = QUESTIONS.filter(function (q) { return q.required !== false; }).length;
        document.getElementById('question-meta').textContent =
          QUESTIONS.length + ' 題 · 必答 ' + required + ' 題';

        var cells = document.getElementById('cells');
        var hubCell = el('button', 'cell cell-hub');
        hubCell.type = 'button';
        hubCell.setAttribute('data-go', '-1');
        hubCell.appendChild(el('span', 'cell-mark', '總覽'));
        cells.appendChild(hubCell);

        var index = document.getElementById('index');
        QUESTIONS.forEach(function (question, i) {
          var cell = el('button', 'cell');
          cell.type = 'button';
          cell.setAttribute('data-go', String(i));
          cell.appendChild(el('span', 'cell-no', pad(i + 1)));
          cell.appendChild(el('span', 'cell-mark'));
          cells.appendChild(cell);

          var item = document.createElement('li');
          var row = el('button');
          row.type = 'button';
          row.setAttribute('data-go', String(i));
          row.appendChild(el('span', 'index-no', pad(i + 1)));
          row.appendChild(el('span', 'index-title', question.title));
          row.appendChild(el('span', 'index-state'));
          item.appendChild(row);
          index.appendChild(item);
        });
      }

      function renderQuestion(question, index) {
        var required = question.required !== false;
        var section = el('section', 'view q');
        section.setAttribute('data-q', question.id);
        section.setAttribute('aria-labelledby', 'qt-' + question.id);
        section.hidden = true;

        var num = el('div', 'q-num', pad(index + 1));
        num.setAttribute('aria-hidden', 'true');
        section.appendChild(num);

        var main = el('div', 'q-main');
        var heading = el('h2', 'q-title', question.title);
        heading.id = 'qt-' + question.id;
        heading.tabIndex = -1;
        main.appendChild(heading);

        var tags = el('p', 'q-tags');
        tags.appendChild(el('span', 'sr', '第 ' + (index + 1) + ' 題，'));
        tags.appendChild(el('span', 'tag ' + (required ? 'tag-req' : 'tag-opt'), required ? '必答' : '選答'));
        tags.appendChild(el('span', null, required ? '影響行為或契約' : '留白仍會列為待確認'));
        tags.appendChild(el('span', 'q-id', String(question.id).toUpperCase()));
        main.appendChild(tags);

        main.appendChild(el('p', 'q-source', question.sourceQuestion));

        var fieldset = el('fieldset', 'opts');
        fieldset.appendChild(el('legend', 'sr', '請選擇一個答案'));
        (question.options || []).forEach(function (option, optionIndex) {
          var label = el('label', 'opt');
          var input = document.createElement('input');
          input.type = 'radio';
          input.className = 'sr';
          input.name = question.id;
          input.value = optionLabel(option);
          label.appendChild(input);

          var cap = el('span', 'cap', String(optionIndex + 1));
          cap.setAttribute('aria-hidden', 'true');
          label.appendChild(cap);

          var body = el('span', 'opt-body');
          var title = el('span', 'opt-title');
          title.appendChild(document.createTextNode(option.title));
          if (question.recommendation && option.key === question.recommendation) {
            title.appendChild(el('span', 'rec', '建議'));
          }
          body.appendChild(title);
          if (option.note) body.appendChild(el('span', 'opt-note', option.note));
          label.appendChild(body);
          label.appendChild(el('span', 'opt-key', option.key));
          fieldset.appendChild(label);
        });
        main.appendChild(fieldset);

        var clear = el('button', 'clear', '取消選擇，讓這題留白');
        clear.type = 'button';
        clear.setAttribute('data-clear', question.id);
        clear.hidden = true;
        main.appendChild(clear);
        section.appendChild(main);

        var side = el('aside', 'q-side');
        var context = isArray(question.context) ? question.context : [];
        if (context.length) {
          side.appendChild(el('h3', 'side-label', '背景'));
          var list = el('ul');
          context.forEach(function (line) { list.appendChild(el('li', null, line)); });
          side.appendChild(list);
        }
        if (question.scenario) {
          side.appendChild(el('h3', 'side-label', '實際情境'));
          side.appendChild(el('p', null, question.scenario));
        }
        var noteId = 'note-' + question.id;
        var noteLabel = el('label', 'side-label', '補充說明（可不填）');
        noteLabel.setAttribute('for', noteId);
        var textarea = document.createElement('textarea');
        textarea.id = noteId;
        textarea.setAttribute('data-note', question.id);
        textarea.placeholder = '可以補充實務限制、例外或團隊已有的決定';
        side.appendChild(noteLabel);
        side.appendChild(textarea);
        section.appendChild(side);

        return section;
      }

      function sectionOf(id) {
        return document.querySelector('.q[data-q="' + id + '"]');
      }

      function selected(id) {
        var radio = document.querySelector('input[name="' + id + '"]:checked');
        return radio ? radio.value : '';
      }

      function note(id) {
        var field = document.querySelector('textarea[data-note="' + id + '"]');
        return field ? field.value.trim() : '';
      }

      // Safari can refuse localStorage on file:// URLs, and the questionnaire is
      // always opened as a file. Losing a half-finished answer set silently is worse
      // than not persisting it, so probe once and say so on the page.
      function storageWorks() {
        try {
          localStorage.setItem('__grill_probe__', '1');
          localStorage.removeItem('__grill_probe__');
          return true;
        } catch (e) {
          return false;
        }
      }

      function warnPersistence() {
        storageReady = false;
        document.getElementById('no-persist').hidden = false;
      }

      function save() {
        if (!storageReady) return;
        var data = { answers: {}, notes: {} };
        QUESTIONS.forEach(function (question) {
          var answer = selected(question.id);
          var extra = note(question.id);
          if (answer) data.answers[question.id] = answer;
          if (extra) data.notes[question.id] = extra;
        });
        try { localStorage.setItem(storageKey, JSON.stringify(data)); } catch (e) { warnPersistence(); }
      }

      function restore() {
        var raw;
        try { raw = localStorage.getItem(storageKey); } catch (e) { warnPersistence(); return; }
        if (!raw) return;
        var data;
        try { data = JSON.parse(raw); } catch (e) { return; }
        QUESTIONS.forEach(function (question) {
          var answer = data.answers && data.answers[question.id];
          if (answer) {
            Array.prototype.forEach.call(
              document.querySelectorAll('input[name="' + question.id + '"]'),
              function (radio) { radio.checked = radio.value === answer; }
            );
          }
          var field = document.querySelector('textarea[data-note="' + question.id + '"]');
          if (field && data.notes && data.notes[question.id]) field.value = data.notes[question.id];
        });
      }

      function setStatus(message, missing) {
        var status = document.getElementById('status');
        status.textContent = message;
        status.className = missing ? 'status missing' : 'status';
      }

      // The reply prompt is the contract with the owning agent: keep its wording stable.
      function buildSummary() {
        var lines = [
          '請根據以下 grill 問卷回覆繼續處理。',
          '',
          '【問卷主題】' + (DATA.title || document.title),
          '',
          '【決策回覆】'
        ];
        var pendingRequired = [];
        var pendingOptional = [];
        var noteOnly = [];

        QUESTIONS.forEach(function (question) {
          var id = String(question.id).toUpperCase();
          var answer = selected(question.id);
          var extra = note(question.id);
          var required = question.required !== false;
          var recommended = recommendedOption(question);

          lines.push(id + '｜' + question.title);
          if (answer) {
            lines.push('     選擇：' + answer);
          } else if (extra) {
            lines.push('     未選擇選項：請依下方補充說明判斷，不要逕自套用頁面建議');
            noteOnly.push(id);
          } else {
            lines.push('     未回答：待確認，不要自行假設'
              + (recommended ? '（頁面建議為「' + optionLabel(recommended) + '」，需使用者確認才算數）' : ''));
            if (required) pendingRequired.push(id); else pendingOptional.push(id);
          }
          if (extra) lines.push('     補充：' + extra.replace(/\n/g, '\n            '));
          lines.push('');
        });

        var pending = pendingRequired.concat(pendingOptional);
        lines.push('【回覆規則】');
        lines.push('1. 明確選擇視為本輪已確認決策。若只有補充說明，先依原文判讀；能無歧義表達決定才確認，否則保持待確認，且不得套用頁面建議。');
        lines.push('2. 完全留白的題目一律視為待確認。頁面建議只是建議，未經使用者確認不得直接採用，也不要替使用者決定。');
        if (pending.length) {
          lines.push('3. 仍待確認：'
              + (pendingRequired.length ? '必答 ' + pendingRequired.join('、') : '')
              + (pendingRequired.length && pendingOptional.length ? '；' : '')
              + (pendingOptional.length ? '選答 ' + pendingOptional.join('、') : '')
              + (pending.length && noteOnly.length ? '；' : '')
              + (noteOnly.length ? '純備註交由 owning agent 判讀 ' + noteOnly.join('、') : '')
              + '。先判讀每則純備註；能無歧義表達決定就直接確認，只有歧義備註才與留白題一起向使用者確認。沒有任何 open matter 後才繼續原本的 Matt workflow。');
        } else if (noteOnly.length) {
          lines.push('3. 沒有完全留白題。請立即判讀純備註 ' + noteOnly.join('、')
            + '：能無歧義表達決定就確認並繼續原本的 Matt workflow；只有仍有歧義時才保持 open 並集中向使用者確認。');
        } else {
          lines.push('3. 所有題目都已表態；請摘要採用的決策、指出風險，並繼續原本的 Matt workflow。');
        }

        return { text: lines.join('\n').trim(), pending: pending, noteOnly: noteOnly };
      }

      function copyStatus(summary) {
        var pending = summary.pending;
        var noteOnly = summary.noteOnly;
        setStatus(
          pending.length
            ? '已複製。尚有 ' + pending.length + ' 題留白'
              + '（' + pending.join('、') + '）'
              + (noteOnly.length ? '，另有 ' + noteOnly.length + ' 題純備註待判讀（' + noteOnly.join('、') + '）' : '')
              + '；owning agent 判讀純備註並完成所有確認前，workflow 保持暫停。'
            : noteOnly.length
              ? '已複製。沒有留白題；' + noteOnly.length + ' 題純備註會交由 owning agent 立即判讀。'
              : '已複製，所有題目都已表態。貼回原本的對話即可。',
          pending.length > 0
        );
      }

      // Required questions without a choice, by on-screen number.
      function liveStatus() {
        if (copiedText !== null) {
          if (copiedText !== buildSummary().text) setStatus('複製後答案有變更，記得重新複製回復 prompt。', true);
          return;
        }
        var missing = [];
        QUESTIONS.forEach(function (question, i) {
          if (question.required !== false && !selected(question.id) && !note(question.id)) missing.push(pad(i + 1));
        });
        if (missing.length) setStatus('必答 ' + missing.join('、') + ' 還沒決定', true);
        else setStatus('必答都已表態，可以複製回復 prompt。', false);
      }

      function refresh() {
        var answered = 0;
        var cells = document.querySelectorAll('#cells .cell');
        var states = document.querySelectorAll('#index .index-state');
        QUESTIONS.forEach(function (question, i) {
          var answer = selected(question.id);
          var extra = note(question.id);
          var required = question.required !== false;
          var cell = cells[i + 1];
          var mark = cell.querySelector('.cell-mark');
          var state = states[i];
          var option = answer ? optionByLabel(question, answer) : null;
          var label;
          cell.className = 'cell';
          state.className = 'index-state';
          if (option) {
            answered++;
            cell.classList.add('is-done');
            mark.textContent = option.key;
            state.classList.add('is-done');
            state.textContent = option.title;
            label = '已選 ' + option.title;
          } else if (extra) {
            cell.classList.add('is-note');
            mark.textContent = '註';
            state.textContent = '只有補充說明';
            label = '只有補充說明';
          } else if (required) {
            cell.classList.add('is-must');
            mark.textContent = '必';
            state.classList.add('is-must');
            state.textContent = '必答，還沒選';
            label = '必答，還沒選';
          } else {
            mark.textContent = '';
            state.textContent = '留白';
            label = '選答，留白';
          }
          cell.setAttribute('aria-label', '第 ' + (i + 1) + ' 題 ' + question.title + '：' + label);
          cell.title = pad(i + 1) + ' ' + question.title;
          var clear = document.querySelector('[data-clear="' + question.id + '"]');
          if (clear) clear.hidden = !answer;
        });
        var counter = document.getElementById('counter');
        counter.textContent = '';
        counter.appendChild(el('b', null, String(answered)));
        counter.appendChild(document.createTextNode(' / ' + QUESTIONS.length));
        counter.setAttribute('aria-label', '已回答 ' + answered + ' / ' + QUESTIONS.length);
        document.getElementById('summary').value = buildSummary().text;
        liveStatus();
      }

      function viewOf(i) {
        return i < 0 ? document.getElementById('hub') : sectionOf(QUESTIONS[i].id);
      }

      function show(i, focus) {
        i = Math.max(-1, Math.min(QUESTIONS.length - 1, i));
        var previous = at;
        var current = viewOf(previous);
        var target = viewOf(i);
        if (current) current.hidden = true;
        target.hidden = false;
        target.classList.remove('enter', 'enter-back');
        if (focus && i !== previous) {
          void target.offsetWidth;
          target.classList.add(i > previous ? 'enter' : 'enter-back');
        }
        at = i;

        Array.prototype.forEach.call(document.querySelectorAll('#cells .cell'), function (cell) {
          if (Number(cell.getAttribute('data-go')) === i) {
            cell.setAttribute('aria-current', 'step');
            if (cell.scrollIntoView) cell.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          } else {
            cell.removeAttribute('aria-current');
          }
        });

        document.getElementById('hint-pick').hidden = i < 0;
        document.getElementById('hint-clear').hidden = i < 0;
        if (i >= 0) document.getElementById('hint-max').textContent = String(QUESTIONS[i].options.length);

        var prev = document.getElementById('prev');
        var next = document.getElementById('next');
        prev.disabled = i < 0;
        prev.textContent = i === 0 ? '回總覽' : '上一題';
        next.innerHTML = '';
        next.appendChild(document.createTextNode(i < 0 ? '開始作答' : i === QUESTIONS.length - 1 ? '回總覽' : '下一題'));
        next.insertAdjacentHTML('beforeend', ARROW);

        if (focus) {
          window.scrollTo(0, 0);
          var heading = i < 0 ? document.getElementById('title') : target.querySelector('.q-title');
          heading.focus({ preventScroll: true });
        }
      }

      function goNext() { show(at === QUESTIONS.length - 1 ? -1 : at + 1, true); }
      function goPrev() { if (at >= 0) show(at - 1, true); }

      function goNextBlank() {
        for (var step = 1; step <= QUESTIONS.length; step++) {
          var i = ((at < 0 ? -1 : at) + step) % QUESTIONS.length;
          if (!selected(QUESTIONS[i].id) && !note(QUESTIONS[i].id)) { show(i, true); return; }
        }
        show(-1, true);
        setStatus('每一題都已表態，可以複製回復 prompt。', false);
      }

      function choose(index, viaKey) {
        if (at < 0) return;
        var section = viewOf(at);
        var radios = section.querySelectorAll('input[type="radio"]');
        if (index === -1) {
          Array.prototype.forEach.call(radios, function (radio) { radio.checked = false; });
          save(); refresh();
          return;
        }
        var radio = radios[index];
        if (!radio) return;
        radio.checked = true;
        if (viaKey) {
          var label = radio.parentNode;
          label.classList.add('pressed');
          setTimeout(function () { label.classList.remove('pressed'); }, 120);
        }
        save(); refresh();
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          var scratch = document.createElement('textarea');
          scratch.value = text;
          scratch.setAttribute('readonly', '');
          scratch.style.position = 'fixed';
          scratch.style.left = '-9999px';
          document.body.appendChild(scratch);
          scratch.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(scratch);
          if (ok) resolve(); else reject();
        });
      }

      function copy() {
        var summary = buildSummary();
        document.getElementById('summary').value = summary.text;
        copyText(summary.text).then(
          function () { copiedText = summary.text; copyStatus(summary); },
          function () {
            show(-1, false);
            var output = document.getElementById('summary');
            output.focus();
            output.select();
            setStatus('自動複製失敗：回復 prompt 已選取，請按 Ctrl+C（Mac 為 ⌘C）複製。', true);
          }
        );
      }

      renderHead();
      var stage = document.getElementById('stage');
      QUESTIONS.forEach(function (question, index) {
        stage.appendChild(renderQuestion(question, index));
      });

      document.addEventListener('change', function (event) {
        if (event.target.matches('input[type="radio"]')) { save(); refresh(); }
      });
      document.addEventListener('input', function (event) {
        if (event.target.matches('textarea[data-note]')) { save(); refresh(); }
      });
      document.addEventListener('click', function (event) {
        var go = event.target.closest('[data-go]');
        if (go) { show(Number(go.getAttribute('data-go')), true); return; }
        var clear = event.target.closest('[data-clear]');
        if (clear) { choose(-1); viewOf(at).querySelector('.q-title').focus(); }
      });
      document.addEventListener('keydown', function (event) {
        if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
        var target = event.target.nodeType === 1 ? event.target : document.body;
        if (target.matches('textarea')) {
          if (event.key === 'Escape') {
            target.blur();
            var heading = viewOf(at).querySelector('.q-title, h1');
            if (heading) heading.focus();
          }
          return;
        }
        var onRadio = target.matches('input[type="radio"]');
        var onButton = target.matches('button');
        var key = event.key;
        if (/^[0-9]$/.test(key) && at >= 0) {
          event.preventDefault();
          choose(key === '0' ? -1 : Number(key) - 1, true);
        } else if (key === 'Enter' && !onButton) {
          event.preventDefault();
          goNext();
        } else if (key === 'ArrowRight' && !onRadio) {
          event.preventDefault();
          goNext();
        } else if (key === 'ArrowLeft' && !onRadio) {
          event.preventDefault();
          goPrev();
        } else if (key === 'n' || key === 'N') {
          event.preventDefault();
          goNextBlank();
        } else if (key === 'c' || key === 'C') {
          event.preventDefault();
          copy();
        }
      });
      document.getElementById('next').addEventListener('click', goNext);
      document.getElementById('prev').addEventListener('click', goPrev);
      document.getElementById('copy').addEventListener('click', copy);
      document.getElementById('reset').addEventListener('click', function () {
        if (!window.confirm('確定清空所有選擇與補充說明？')) return;
        QUESTIONS.forEach(function (question) {
          Array.prototype.forEach.call(
            document.querySelectorAll('input[name="' + question.id + '"]'),
            function (radio) { radio.checked = false; }
          );
          var field = document.querySelector('textarea[data-note="' + question.id + '"]');
          if (field) field.value = '';
        });
        copiedText = null;
        var clearedDraft = true;
        try { localStorage.removeItem(storageKey); } catch (e) { clearedDraft = false; warnPersistence(); }
        refresh();
        setStatus(
          clearedDraft
            ? '答案已清空。'
            : '目前畫面已清空，但舊草稿刪除失敗，重新載入可能復現；請勿依賴草稿保存。',
          !clearedDraft
        );
      });

      storageReady = storageWorks();
      if (storageReady) restore(); else warnPersistence();
      show(-1, false);
      refresh();
    })();
  </script>
</body>
</html>
