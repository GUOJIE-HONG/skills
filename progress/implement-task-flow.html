<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>implement-task 修改後流程</title>
<style>
body{margin:0;background:#f6f7f9;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;color:#222}
.wrap{max-width:1000px;margin:24px auto;padding:0 16px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 16px;font-size:14px;color:#555}
svg{width:100%;height:auto;background:#fff;border:1px solid #e1e4e8;border-radius:8px}
.box{fill:#fff;stroke:#444;stroke-width:1.5}
.dia{fill:#fff;stroke:#444;stroke-width:1.5}
.green{fill:#d4edda;stroke:#28a745}
.yellow{fill:#fff3cd;stroke:#b8860b;stroke-width:2.5}
.red{fill:#f8d7da;stroke:#dc3545}
text{font-size:13px;text-anchor:middle;dominant-baseline:middle}
.lbl{font-size:12px;fill:#666}
.edge{fill:none;stroke:#444;stroke-width:1.5;marker-end:url(#arr)}
.loop{fill:none;stroke:#28a745;stroke-width:2;marker-end:url(#arrg)}
.legend{font-size:12px;fill:#444;text-anchor:start}
</style></head><body><div class="wrap">
<h1>implement-task 修改後的 orchestrator 主迴圈</h1>
<p>黃色「票 done」節點是目前實際停下來的地方。修改後它的唯一出邊（綠線）回到「計算 frontier」，不經過用戶。正常出口只有一個：frontier 空且沒有 worker。</p>
<svg viewBox="0 0 1000 1130" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#28a745"/></marker>
</defs>

<!-- A -->
<rect class="box" x="250" y="20" width="300" height="46" rx="6"/>
<text x="400" y="43">解析輸入 / 建 dependency graph</text>
<!-- B frontier -->
<rect class="box green" x="270" y="110" width="260" height="46" rx="6"/>
<text x="400" y="133">計算 frontier</text>
<!-- C -->
<polygon class="dia" points="400,195 500,235 400,275 300,235"/>
<text x="400" y="235">frontier 有任務?</text>
<!-- D dispatch -->
<rect class="box" x="220" y="315" width="360" height="66" rx="6"/>
<text x="400" y="336">派工：每個任務一個 worktree + fresh sub-agent</text>
<text x="400" y="358" class="lbl">無 sub-agent 時自己跑 execute.md，一次一個，做完回到等回報</text>
<!-- E workers? -->
<polygon class="dia" points="760,195 860,235 760,275 660,235"/>
<text x="760" y="235">還有 worker 在跑?</text>
<!-- M normal end -->
<rect class="box green" x="640" y="20" width="240" height="66" rx="6"/>
<text x="760" y="43">正常結束</text>
<text x="760" y="64" class="lbl">§3 code-review → §4 回報 all done</text>
<!-- F wait -->
<rect class="box" x="290" y="420" width="220" height="46" rx="6"/>
<text x="400" y="443">等任一 worker 回報</text>
<!-- G -->
<polygon class="dia" points="400,505 500,545 400,585 300,545"/>
<text x="400" y="545">回報成功?</text>
<!-- H integrate -->
<rect class="box" x="250" y="625" width="300" height="46" rx="6"/>
<text x="400" y="648">cherry-pick 到整合分支，跑 Validation</text>
<!-- I -->
<polygon class="dia" points="400,710 500,750 400,790 300,750"/>
<text x="400" y="750">驗證通過?</text>
<!-- J -->
<polygon class="dia" points="400,830 520,870 400,910 280,870"/>
<text x="400" y="870">該票所有任務都整合了?</text>
<!-- K ticket done -->
<rect class="box yellow" x="230" y="950" width="340" height="66" rx="6"/>
<text x="400" y="971">跑票的 acceptance</text>
<text x="400" y="993" class="lbl">票設 done、commit tracker（這裡不是終點）</text>
<!-- L -->
<polygon class="dia" points="400,1050 500,1090 400,1130 300,1090"/>
<text x="400" y="1090">acceptance 通過?</text>
<!-- X failure stop -->
<rect class="box red" x="660" y="700" width="260" height="86" rx="6"/>
<text x="790" y="722">失敗停止</text>
<text x="790" y="743" class="lbl">停派工、收回報、保留 worktree</text>
<text x="790" y="764" class="lbl">§4 回報，列出 ready / blocked</text>

<!-- edges main column -->
<path class="edge" d="M400,66 L400,110"/>
<path class="edge" d="M400,156 L400,195"/>
<path class="edge" d="M400,275 L400,315"/><text x="418" y="295" class="lbl">有</text>
<path class="edge" d="M500,235 L660,235"/><text x="580" y="222" class="lbl">沒有</text>
<path class="edge" d="M760,195 L760,86"/><text x="785" y="140" class="lbl">沒有</text>
<path class="edge" d="M760,275 L760,443 L510,443"/><text x="785" y="360" class="lbl">有</text>
<path class="edge" d="M400,381 L400,420"/>
<path class="edge" d="M400,466 L400,505"/>
<path class="edge" d="M400,585 L400,625"/><text x="418" y="605" class="lbl">是</text>
<path class="edge" d="M400,671 L400,710"/>
<path class="edge" d="M400,790 L400,830"/><text x="418" y="810" class="lbl">是</text>
<path class="edge" d="M400,910 L400,950"/><text x="418" y="930" class="lbl">是</text>
<path class="edge" d="M400,1016 L400,1050"/>
<!-- failure edges -->
<path class="edge" d="M500,545 L620,545 L620,720 L660,720"/><text x="560" y="532" class="lbl">否</text>
<path class="edge" d="M500,750 L660,750"/><text x="560" y="737" class="lbl">否</text>
<path class="edge" d="M500,1090 L640,1090 L640,770 L660,770"/><text x="560" y="1077" class="lbl">否</text>
<!-- loop edges back to B -->
<path class="loop" d="M280,870 L150,870 L150,133 L270,133"/><text x="215" y="857" class="lbl">否，重算</text>
<path class="loop" d="M300,1090 L90,1090 L90,120 L270,120"/><text x="190" y="1077" class="lbl">是，重算 frontier（不問用戶）</text>

<!-- legend -->
<rect x="560" y="965" width="16" height="16" class="box green"/><text x="584" y="973" class="legend">frontier / 正常出口</text>
<rect x="560" y="990" width="16" height="16" class="box yellow"/><text x="584" y="998" class="legend">原本停下來的地方</text>
<rect x="560" y="1015" width="16" height="16" class="box red"/><text x="584" y="1023" class="legend">唯一允許中途交回的出口</text>
</svg>
</div></body></html>
