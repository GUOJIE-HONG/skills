<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grill 決策問卷</title>
  <style>
    :root {
      --ground: #f4f4f1;
      --surface: #fff;
      --surface-2: #fafaf7;
      --ink: #1a1b1e;
      --ink-mid: #4e5057;
      --ink-soft: #74767e;
      --rule: #e2e1dc;
      --accent: #c2570a;
      --accent-wash: #fbf0e4;
      --good: #2c6e52;
      --good-wash: #e8f1ec;
      --warn: #9c3628;
      --shadow: 0 1px 2px rgba(26, 27, 30, .05), 0 8px 24px -18px rgba(26, 27, 30, .35);
      --font-sans: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Noto Sans Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #141518;
        --surface: #1c1e22;
        --surface-2: #212429;
        --ink: #ecebe7;
        --ink-mid: #b4b6bc;
        --ink-soft: #8a8c93;
        --rule: #2e3138;
        --accent: #ee8a38;
        --accent-wash: #2c2117;
        --good: #63bc94;
        --good-wash: #1a2620;
        --warn: #e28576;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -18px rgba(0, 0, 0, .8);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--ground);
      border-bottom: 1px solid var(--rule);
    }
    .bar-inner, .wrap { max-width: 800px; margin: 0 auto; }
    .bar-inner { padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
    .bar-label, .eyebrow, .meta, .question-id {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .06em;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }
    .bar-label { white-space: nowrap; }
    .track { flex: 1; height: 4px; background: var(--rule); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
    .wrap { padding: 0 20px 96px; }
    header { padding: 52px 0 8px; }
    .eyebrow { margin: 0 0 14px; color: var(--accent); text-transform: uppercase; letter-spacing: .14em; }
    h1 { margin: 0 0 18px; font-size: 34px; line-height: 1.3; letter-spacing: -.01em; }
    h2 { margin: 0; font-size: 23px; line-height: 1.4; }
    h3 { margin: 18px 0 8px; font-size: 20px; line-height: 1.5; }
    p { margin: 0 0 14px; }
    .lede, .section-lede { color: var(--ink-mid); max-width: 64ch; }
    .howto, .recap, .case { padding: 16px 18px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface-2); color: var(--ink-mid); }
    .howto { margin-top: 26px; font-size: 15px; }
    .howto strong, .case strong { color: var(--ink); }
    .sep { border: 0; border-top: 1px solid var(--rule); margin: 44px 0; }
    .section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .meta { letter-spacing: .08em; }
    .recap { margin: 18px 0 0; background: var(--good-wash); border-color: var(--good); }
    .recap ul { margin: 0; padding-left: 22px; }
    .question { margin: 22px 0; padding: 26px 24px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); }
    .question.optional { border-left: 4px solid var(--accent); }
    .question-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .question-id { padding: 3px 8px; border-radius: 5px; background: var(--accent-wash); color: var(--accent); }
    .question-kind { color: var(--ink-soft); font-size: 13px; }
    .source-question { margin: 14px 0 0; padding: 16px 18px; border-left: 4px solid var(--ink); background: var(--surface-2); }
    .source-question p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .source-question-label { display: block; margin-bottom: 7px; color: var(--ink); font-size: 13px; font-weight: 700; }
    .case { margin: 18px 0; }
    .context { margin: 12px 0 0; padding-left: 21px; color: var(--ink-mid); }
    .context li { margin: 5px 0; }
    .case-label { display: block; margin-bottom: 6px; color: var(--accent); font-size: 13px; font-weight: 700; }
    fieldset { margin: 20px 0 0; padding: 0; border: 0; }
    legend { margin-bottom: 10px; color: var(--ink-mid); font-size: 14px; }
    .option { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; padding: 14px 15px; border: 1px solid var(--rule); border-radius: 9px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
    .option:hover, .option:has(input:checked) { border-color: var(--accent); background: var(--accent-wash); }
    .option input { flex: 0 0 auto; margin-top: 5px; accent-color: var(--accent); }
    .option-title { display: block; font-weight: 650; }
    .option-note { display: block; margin-top: 3px; color: var(--ink-mid); font-size: 14px; }
    .option-key { display: inline-block; min-width: 24px; color: var(--accent); font-family: var(--font-mono); }
    .recommendation { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 99px; background: var(--good-wash); color: var(--good); font-size: 12px; font-weight: 600; }
    .note-wrap { margin-top: 18px; }
    .note-label { display: block; margin-bottom: 6px; color: var(--ink-mid); font-size: 14px; }
    textarea { width: 100%; min-height: 86px; resize: vertical; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); color: var(--ink); font: inherit; line-height: 1.6; }
    textarea:focus, input:focus-visible, button:focus-visible { outline: 3px solid rgba(194, 87, 10, .28); outline-offset: 2px; }
    .output { margin-top: 44px; padding: 24px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 12px; }
    button { padding: 10px 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); }
    .status { min-height: 24px; margin: 10px 0 0; color: var(--good); font-size: 14px; }
    .status.missing { color: var(--warn); }
    code { padding: 1px 4px; border-radius: 4px; background: var(--surface-2); font-family: var(--font-mono); font-size: .9em; }
    .notice { margin: 14px 0 0; padding: 14px 16px; border: 1px solid var(--warn); border-radius: 10px; background: var(--surface-2); color: var(--warn); font-size: 15px; }
    .notice strong { color: var(--warn); }
    .fatal { margin: 52px 0; padding: 26px 24px; border: 1px solid var(--warn); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .fatal .eyebrow { color: var(--warn); }
    .fatal-list { margin: 0 0 20px; padding-left: 22px; color: var(--ink-mid); }
    .fatal-list li { margin: 9px 0; }
    @media (max-width: 560px) {
      header { padding-top: 34px; }
      h1 { font-size: 27px; }
      .question, .output { padding: 20px 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .fill, .option { transition: none; } }
  </style>
</head>
<body>
  <div class="bar" aria-label="問卷進度">
    <div class="bar-inner">
      <span class="bar-label" id="counter">已回答 0 / 0</span>
      <span class="track"><span class="fill" id="fill"></span></span>
    </div>
  </div>

  <div class="wrap">
    <header>
      <p class="eyebrow">Grill · 決策問卷</p>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
      <div class="howto">請逐題回答。若沒有意見，可以直接選頁面標示的<strong>建議</strong>；<strong>留白會被視為待確認，不會自動採用建議</strong>。也可以只填補充說明，由我依你的說明判斷。完成後按下方的<strong>整理回復 prompt</strong>，再複製回對話。</div>
      <p class="notice" id="no-persist" hidden>無法保存草稿：重新整理或關閉頁面會失去尚未複製的答案。請一次答完，或隨時用下方的<strong>整理回復 prompt</strong> 手動備份。</p>
    </header>

    <section id="recap-section" aria-labelledby="recap-title" hidden>
      <hr class="sep">
      <div class="section-head">
        <h2 id="recap-title">目前已確認</h2>
      </div>
      <div class="recap"><ul id="recap-list"></ul></div>
    </section>

    <hr class="sep">

    <main id="questions" aria-label="待回答問題">
      <div class="section-head">
        <h2>需要你的決定</h2>
        <span class="meta" id="question-meta"></span>
      </div>
    </main>

    <section class="output" aria-labelledby="output-title">
      <h2 id="output-title">產生回復 prompt</h2>
      <p>完成選擇後，按「整理回復 prompt」。即使有未回答項目，也可以先產生草稿；必答題會在 prompt 中清楚列出。</p>
      <div class="button-row">
        <button type="button" id="generate">整理回復 prompt</button>
        <button type="button" class="secondary" id="copy">複製回復 prompt</button>
        <button type="button" class="secondary" id="reset">清空答案</button>
      </div>
      <textarea id="summary" readonly aria-label="可複製的回復 prompt" placeholder="按「整理回復 prompt」後，結果會出現在這裡"></textarea>
      <p class="status" id="status" role="status"></p>
    </section>
  </div>

  <script id="questionnaire-data" type="application/json">
{}
  </script>

  <script>
    (function () {
      // This renderer owns the complete payload contract and fails closed when
      // the embedded decision data is incomplete or invalid.
      var DATA = null;
      var problems = [];
      try {
        DATA = JSON.parse(document.getElementById('questionnaire-data').textContent);
      } catch (parseError) {
        problems.push('payload 不是合法的 JSON：' + parseError.message);
      }
      if (DATA) problems = validate(DATA);
      if (problems.length) { renderFatal(problems); return; }

      var QUESTIONS = DATA.questions;
      var storageKey = 'show-grill-clearly:' + location.pathname;
      var storageReady = false;

      function isArray(value) {
        return Object.prototype.toString.call(value) === '[object Array]';
      }

      // Collect every problem rather than stopping at the first — one round trip
      // beats making the agent regenerate the questionnaire once per mistake.
      function validate(data) {
        var found = [];
        function isObject(value) { return value !== null && typeof value === 'object' && !isArray(value); }
        function own(value, key) { return Object.prototype.hasOwnProperty.call(value, key); }
        function fields(value, allowed, path) {
          Object.keys(value).forEach(function (key) {
            if (allowed.indexOf(key) < 0) found.push(path + ' 有未知欄位 ' + key + '。');
          });
        }
        function text(value, key, path, limit) {
          if (!own(value, key) || typeof value[key] !== 'string' || !value[key].trim()) {
            found.push(path + '.' + key + ' 必須是非空白字串。'); return false;
          }
          if (limit && value[key].length > limit) {
            found.push(path + '.' + key + ' 超過 ' + limit + ' 字（目前 ' + value[key].length + ' 字）。');
          }
          return true;
        }
        if (!isObject(data)) return ['payload 根節點必須是物件。'];
        fields(data, ['title', 'lede', 'recap', 'questions'], 'payload');
        text(data, 'title', 'payload', 0);
        if (text(data, 'lede', 'payload', 40)) {
          var marks = data.lede.match(/[。！？!?]/g) || [];
          if (marks.length > 1 || (marks.length === 1 && !/[。！？!?]\s*$/.test(data.lede))) {
            found.push('payload.lede 必須只有一句。');
          }
        }
        if (!isArray(data.recap)) {
          found.push('payload.recap 必須是字串陣列。');
        } else {
          if (data.recap.length > 6) found.push('payload.recap 最多 6 則（目前 ' + data.recap.length + ' 則）。');
          data.recap.forEach(function (item, i) {
            if (typeof item !== 'string' || !item.trim()) found.push('payload.recap[' + i + '] 必須是非空白字串。');
            else if (item.length > 30) found.push('payload.recap[' + i + '] 超過 30 字（目前 ' + item.length + ' 字）。');
          });
        }
        var questions = data.questions;
        if (!isArray(questions) || !questions.length) {
          found.push('payload.questions 必須是至少含一題的陣列。'); return found;
        }

        var seen = Object.create(null);
        var total = (typeof data.title === 'string' ? data.title.length : 0)
          + (typeof data.lede === 'string' ? data.lede.length : 0);
        if (isArray(data.recap)) data.recap.forEach(function (x) { if (typeof x === 'string') total += x.length; });
        questions.forEach(function (question, index) {
          var at = 'questions[' + index + ']';
          if (!isObject(question)) { found.push(at + ' 必須是物件。'); return; }
          fields(question, ['id', 'title', 'sourceQuestion', 'required', 'context', 'scenario', 'recommendation', 'options'], at);
          if (text(question, 'id', at, 64)) {
            total += question.id.length;
            if (!/^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(question.id)) found.push(at + '.id 格式不合法。');
            var foldedId = question.id.toLowerCase();
            if (seen[foldedId]) found.push(at + '.id 與另一題重複（不分大小寫）。');
            seen[foldedId] = true;
          }
          if (text(question, 'title', at, 30)) total += question.title.length;
          if (text(question, 'sourceQuestion', at, 180)) total += question.sourceQuestion.length;
          if (!own(question, 'required') || typeof question.required !== 'boolean') found.push(at + '.required 必須是 boolean。');
          if (text(question, 'scenario', at, 80)) total += question.scenario.length;
          if (!isArray(question.context) || question.context.length < 1 || question.context.length > 3) {
            found.push(at + '.context 必須是含 1–3 則事實的字串陣列。');
          }
          if (isArray(question.context)) question.context.forEach(function (fact, contextIndex) {
            if (typeof fact !== 'string' || !fact.trim()) found.push(at + '.context[' + contextIndex + '] 必須是非空白字串。');
            else { total += fact.length; if (fact.length > 40) found.push(at + '.context[' + contextIndex + '] 超過 40 字（目前 ' + fact.length + ' 字）。'); }
          });
          var options = isArray(question.options) ? question.options : [];
          if (options.length < 2 || options.length > 4) found.push(at + '.options 必須有 2–4 個選項（目前 ' + options.length + ' 個）。');
          var keys = Object.create(null);
          options.forEach(function (option, optionIndex) {
            var optionAt = at + '.options[' + optionIndex + ']';
            if (!isObject(option)) { found.push(optionAt + ' 必須是物件。'); return; }
            fields(option, ['key', 'title', 'note'], optionAt);
            if (text(option, 'key', optionAt, 64)) {
              total += option.key.length;
              if (!/^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(option.key)) found.push(optionAt + '.key 格式不合法。');
              var foldedKey = option.key.toLowerCase();
              if (keys[foldedKey]) found.push(optionAt + '.key 在本題重複（不分大小寫）。');
              keys[foldedKey] = true;
            }
            if (text(option, 'title', optionAt, 20)) total += option.title.length;
            if (text(option, 'note', optionAt, 40)) total += option.note.length;
          });
          if (own(question, 'recommendation')) {
            if (typeof question.recommendation !== 'string' || !question.recommendation.trim()) {
              found.push(at + '.recommendation 若提供，必須是非空白字串。');
            } else if (!keys[question.recommendation.toLowerCase()]) {
              found.push(at + '.recommendation 必須對應本題的一個 option key。');
            }
          }
        });
        // Scale with question count rather than checking one exact length: splitting an
        // overlong question is the prescribed remedy, so it must not escape the budget.
        var budget = questions.length * 480;
        if (questions.length >= 5 && total > budget) {
          found.push('問卷的動態文字超過 ' + budget + ' 字（' + questions.length
            + ' 題 × 480；目前 ' + total + ' 字）；請縮短，或把後面的決定移到下一輪問卷。');
        }
        return found;
      }

      function renderFatal(list) {
        document.title = '問卷資料有誤 · Grill';
        var bar = document.querySelector('.bar');
        if (bar) bar.hidden = true;

        var wrap = document.querySelector('.wrap');
        wrap.textContent = '';

        var box = el('section', 'fatal');
        box.appendChild(el('p', 'eyebrow', 'Grill · 問卷資料有誤'));
        box.appendChild(el('h1', null, '這份問卷沒有產生出來'));
        box.appendChild(el('p', 'lede', 'payload 有下列問題，所以問卷完全沒有渲染——'
          + '一份只能答一半的問卷比明確的錯誤更難處理。把下面整段貼回對話，修正 payload 後重新產生問卷即可。'));

        var ul = el('ul', 'fatal-list');
        list.forEach(function (item) { ul.appendChild(el('li', null, item)); });
        box.appendChild(ul);

        var label = el('label', 'note-label', '可複製的錯誤說明');
        label.setAttribute('for', 'fatal-copy');
        box.appendChild(label);
        var output = document.createElement('textarea');
        output.id = 'fatal-copy';
        output.readOnly = true;
        output.value = '問卷 payload 有下列問題，請修正後重新產生問卷：\n'
          + list.map(function (item) { return '- ' + item; }).join('\n');
        box.appendChild(output);

        wrap.appendChild(box);
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function recommendedOption(question) {
        var options = question.options || [];
        for (var i = 0; i < options.length; i++) {
          if (question.recommendation && options[i].key === question.recommendation) return options[i];
        }
        return null;
      }

      function optionLabel(option) {
        return option.key + '｜' + option.title;
      }

      function renderHead() {
        document.getElementById('title').textContent = DATA.title || 'Grill 決策問卷';
        document.title = DATA.title || 'Grill 決策問卷';
        var lede = document.getElementById('lede');
        if (DATA.lede) lede.textContent = DATA.lede; else lede.hidden = true;

        var recap = DATA.recap || [];
        if (recap.length) {
          var list = document.getElementById('recap-list');
          recap.forEach(function (item) { list.appendChild(el('li', null, item)); });
          document.getElementById('recap-section').hidden = false;
        }

        var required = QUESTIONS.filter(function (q) { return q.required !== false; }).length;
        document.getElementById('question-meta').textContent =
          QUESTIONS.length + ' 題 · 必答 ' + required + ' 題';
      }

      function renderQuestion(question, index) {
        var required = question.required !== false;
        var section = el('section', 'question' + (required ? '' : ' optional'));
        section.setAttribute('data-q', question.id);

        var head = el('div', 'question-head');
        head.appendChild(el('span', 'question-id', String(question.id).toUpperCase()));
        head.appendChild(el('span', 'question-kind', required ? '必答 · 影響行為或契約' : '選答 · 留白仍會列為待確認'));
        section.appendChild(head);

        section.appendChild(el('h3', null, question.title));

        var source = el('div', 'source-question');
        source.appendChild(el('span', 'source-question-label', '這題在問什麼'));
        source.appendChild(el('p', null, question.sourceQuestion));
        section.appendChild(source);

        var context = isArray(question.context) ? question.context : [];
        if (context.length) {
          var list = el('ul', 'context');
          context.forEach(function (line) { list.appendChild(el('li', null, line)); });
          section.appendChild(list);
        }

        if (question.scenario) {
          var box = el('div', 'case');
          box.appendChild(el('span', 'case-label', '實際情境'));
          box.appendChild(el('p', null, question.scenario));
          section.appendChild(box);
        }

        var fieldset = document.createElement('fieldset');
        fieldset.appendChild(el('legend', null, '請選擇一個答案'));
        (question.options || []).forEach(function (option) {
          var label = el('label', 'option');
          var input = document.createElement('input');
          input.type = 'radio';
          input.name = question.id;
          input.value = optionLabel(option);
          label.appendChild(input);

          var body = document.createElement('span');
          var title = el('span', 'option-title');
          title.appendChild(el('span', 'option-key', option.key));
          title.appendChild(document.createTextNode(option.title));
          if (question.recommendation && option.key === question.recommendation) {
            title.appendChild(el('span', 'recommendation', '我的建議'));
          }
          body.appendChild(title);
          if (option.note) body.appendChild(el('span', 'option-note', option.note));
          label.appendChild(body);
          fieldset.appendChild(label);
        });
        section.appendChild(fieldset);

        var noteWrap = el('div', 'note-wrap');
        var noteId = 'note-' + question.id;
        var noteLabel = el('label', 'note-label', '補充說明（可不填）');
        noteLabel.setAttribute('for', noteId);
        var textarea = document.createElement('textarea');
        textarea.id = noteId;
        textarea.setAttribute('data-note', question.id);
        textarea.placeholder = '可以補充實務限制、例外或團隊已有的決定';
        noteWrap.appendChild(noteLabel);
        noteWrap.appendChild(textarea);
        section.appendChild(noteWrap);

        return section;
      }

      function sectionOf(id) {
        return document.querySelector('.question[data-q="' + id + '"]');
      }

      function selected(id) {
        var radio = document.querySelector('input[name="' + id + '"]:checked');
        return radio ? radio.value : '';
      }

      function note(id) {
        var field = document.querySelector('textarea[data-note="' + id + '"]');
        return field ? field.value.trim() : '';
      }

      // Safari can refuse localStorage on file:// URLs, and the questionnaire is
      // always opened as a file. Losing a half-finished answer set silently is worse
      // than not persisting it, so probe once and say so on the page.
      function storageWorks() {
        try {
          localStorage.setItem('__grill_probe__', '1');
          localStorage.removeItem('__grill_probe__');
          return true;
        } catch (e) {
          return false;
        }
      }

      function warnPersistence() {
        storageReady = false;
        document.getElementById('no-persist').hidden = false;
      }

      function save() {
        if (!storageReady) return;
        var data = { answers: {}, notes: {} };
        QUESTIONS.forEach(function (question) {
          var answer = selected(question.id);
          var extra = note(question.id);
          if (answer) data.answers[question.id] = answer;
          if (extra) data.notes[question.id] = extra;
        });
        try { localStorage.setItem(storageKey, JSON.stringify(data)); } catch (e) { warnPersistence(); }
      }

      function restore() {
        var raw;
        try { raw = localStorage.getItem(storageKey); } catch (e) { warnPersistence(); return; }
        if (!raw) return;
        var data;
        try { data = JSON.parse(raw); } catch (e) { return; }
        QUESTIONS.forEach(function (question) {
          var answer = data.answers && data.answers[question.id];
          if (answer) {
            Array.prototype.forEach.call(
              document.querySelectorAll('input[name="' + question.id + '"]'),
              function (radio) { radio.checked = radio.value === answer; }
            );
          }
          var field = document.querySelector('textarea[data-note="' + question.id + '"]');
          if (field && data.notes && data.notes[question.id]) field.value = data.notes[question.id];
        });
      }

      function progress() {
        var answered = QUESTIONS.filter(function (question) { return !!selected(question.id); }).length;
        document.getElementById('counter').textContent = '已回答 ' + answered + ' / ' + QUESTIONS.length;
        document.getElementById('fill').style.width =
          (QUESTIONS.length ? answered / QUESTIONS.length * 100 : 0) + '%';
      }

      function setStatus(message, missing) {
        var status = document.getElementById('status');
        status.textContent = message;
        status.className = missing ? 'status missing' : 'status';
      }

      function invalidateSummary() {
        var output = document.getElementById('summary');
        if (!output.value) return;
        output.value = '';
        setStatus('答案已變更；請重新整理回復 prompt。', true);
      }

      function generate() {
        var lines = [
          '請根據以下 grill 問卷回覆繼續處理。',
          '',
          '【問卷主題】' + (DATA.title || document.title),
          '',
          '【決策回覆】'
        ];
        var pendingRequired = [];
        var pendingOptional = [];
        var noteOnly = [];

        QUESTIONS.forEach(function (question) {
          var id = String(question.id).toUpperCase();
          var answer = selected(question.id);
          var extra = note(question.id);
          var required = question.required !== false;
          var recommended = recommendedOption(question);

          lines.push(id + '｜' + question.title);
          if (answer) {
            lines.push('     選擇：' + answer);
          } else if (extra) {
            lines.push('     未選擇選項：請依下方補充說明判斷，不要逕自套用頁面建議');
            noteOnly.push(id);
          } else {
            lines.push('     未回答：待確認，不要自行假設'
              + (recommended ? '（頁面建議為「' + optionLabel(recommended) + '」，需使用者確認才算數）' : ''));
            if (required) pendingRequired.push(id); else pendingOptional.push(id);
          }
          if (extra) lines.push('     補充：' + extra.replace(/\n/g, '\n            '));
          lines.push('');
        });

        var pending = pendingRequired.concat(pendingOptional);
        lines.push('【回覆規則】');
        lines.push('1. 明確選擇視為本輪已確認決策。若只有補充說明，先依原文判讀；能無歧義表達決定才確認，否則保持待確認，且不得套用頁面建議。');
        lines.push('2. 完全留白的題目一律視為待確認。頁面建議只是建議，未經使用者確認不得直接採用，也不要替使用者決定。');
        if (pending.length) {
          lines.push('3. 仍待確認：'
              + (pendingRequired.length ? '必答 ' + pendingRequired.join('、') : '')
              + (pendingRequired.length && pendingOptional.length ? '；' : '')
              + (pendingOptional.length ? '選答 ' + pendingOptional.join('、') : '')
              + (pending.length && noteOnly.length ? '；' : '')
              + (noteOnly.length ? '純備註交由 owning agent 判讀 ' + noteOnly.join('、') : '')
              + '。先判讀每則純備註；能無歧義表達決定就直接確認，只有歧義備註才與留白題一起向使用者確認。沒有任何 open matter 後才繼續原本的 Matt workflow。');
        } else if (noteOnly.length) {
          lines.push('3. 沒有完全留白題。請立即判讀純備註 ' + noteOnly.join('、')
            + '：能無歧義表達決定就確認並繼續原本的 Matt workflow；只有仍有歧義時才保持 open 並集中向使用者確認。');
        } else {
          lines.push('3. 所有題目都已表態；請摘要採用的決策、指出風險，並繼續原本的 Matt workflow。');
        }

        document.getElementById('summary').value = lines.join('\n').trim();
        setStatus(
          pending.length
            ? '尚有 ' + pending.length + ' 題留白'
              + (pending.length ? '（' + pending.join('、') + '）' : '')
              + (noteOnly.length ? '，另有 ' + noteOnly.length + ' 題純備註待判讀（' + noteOnly.join('、') + '）' : '')
              + '。可以先複製草稿；owning agent 判讀純備註並完成所有確認前，workflow 保持暫停。'
            : noteOnly.length
              ? '沒有留白題；' + noteOnly.length + ' 題純備註會交由 owning agent 立即判讀，只有仍有歧義時才保持未決。'
              : '所有題目都已表態。複製後貼回原本的對話即可。',
          pending.length > 0
        );
      }

      renderHead();
      var main = document.getElementById('questions');
      QUESTIONS.forEach(function (question, index) {
        main.appendChild(renderQuestion(question, index));
      });

      document.addEventListener('change', function (event) {
        if (event.target.matches('input[type="radio"]')) { invalidateSummary(); save(); progress(); }
      });
      document.addEventListener('input', function (event) {
        if (event.target.matches('textarea[data-note]')) { invalidateSummary(); save(); }
      });
      document.getElementById('generate').addEventListener('click', generate);
      document.getElementById('copy').addEventListener('click', function () {
        var output = document.getElementById('summary');
        generate();
        var text = output.value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { setStatus('已複製回復 prompt，貼回原本的對話即可。', false); },
            function () { setStatus('自動複製失敗，請手動選取回復 prompt。', true); }
          );
          return;
        }
        output.removeAttribute('readonly');
        output.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        output.setAttribute('readonly', '');
        setStatus(ok ? '已複製回復 prompt，貼回原本的對話即可。' : '複製失敗，請手動選取回復 prompt。', !ok);
      });
      document.getElementById('reset').addEventListener('click', function () {
        if (!window.confirm('確定清空所有選擇、補充說明與尚未複製的整理結果？')) return;
        QUESTIONS.forEach(function (question) {
          Array.prototype.forEach.call(
            document.querySelectorAll('input[name="' + question.id + '"]'),
            function (radio) { radio.checked = false; }
          );
          var field = document.querySelector('textarea[data-note="' + question.id + '"]');
          if (field) field.value = '';
        });
        document.getElementById('summary').value = '';
        var clearedDraft = true;
        try { localStorage.removeItem(storageKey); } catch (e) { clearedDraft = false; warnPersistence(); }
        setStatus(
          clearedDraft
            ? '答案已清空。'
            : '目前畫面已清空，但舊草稿刪除失敗，重新載入可能復現；請勿依賴草稿保存。',
          !clearedDraft
        );
        progress();
      });

      storageReady = storageWorks();
      if (storageReady) restore(); else warnPersistence();
      progress();
    })();
  </script>
</body>
</html>
